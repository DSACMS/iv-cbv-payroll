name: CMS Cloud PR Environment Update
run-name: Update CMS Cloud PR Environment ${{ inputs.pr_number || github.event.pull_request.number }}

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
  pull_request_target:
    types: [synchronize]

jobs:
  resolve:
    name: Resolve review-app commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pull-requests: read

    outputs:
      commit_hash: ${{ steps.resolve.outputs.commit_hash }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}

    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request_target checks out the trusted base branch. A manual
          # run uses the selected branch while this workflow is being tested.
          ref: ${{ github.ref }}

      - name: Resolve current pull request head
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            pr_number="${EVENT_PR_NUMBER}"
          else
            pr_number="${REQUESTED_PR_NUMBER}"
          fi

          if [[ ! "${pr_number}" =~ ^[0-9]+$ ]]; then
            echo "PR number must contain only digits: ${pr_number}" >&2
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          if [[ "$(jq -r .state <<< "${pr_json}")" != "open" ]]; then
            echo "PR ${pr_number} is not open." >&2
            exit 1
          fi

          commit_hash="$(jq -r .head.sha <<< "${pr_json}")"
          if [[ ! "${commit_hash}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not return a full head SHA for PR ${pr_number}." >&2
            exit 1
          fi

          should_deploy=true
          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            head_repository="$(jq -r .head.repo.full_name <<< "${pr_json}")"
            if [[ "${head_repository}" != "${GITHUB_REPOSITORY}" ]]; then
              echo "Skipping automatic deployment for fork ${head_repository}."
              should_deploy=false
            elif ! ./bin/cms-pr-environment is-deployed "${pr_number}"; then
              echo "PR ${pr_number} has not opted into a CMS review app; skipping."
              should_deploy=false
            fi
          fi

          {
            echo "pr_number=${pr_number}"
            echo "commit_hash=${commit_hash}"
            echo "should_deploy=${should_deploy}"
          } >> "${GITHUB_OUTPUT}"

  start-deployment:
    name: Create GitHub deployment
    needs: resolve
    if: needs.resolve.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Create queued deployment
        id: deployment
        env:
          COMMIT_HASH: ${{ needs.resolve.outputs.commit_hash }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: |
          deployment_id="$(./bin/cms-pr-environment deployment-start "${PR_NUMBER}" "${COMMIT_HASH}")"
          ./bin/cms-pr-environment deployment-status \
            "${PR_NUMBER}" "${deployment_id}" queued "Waiting for the review image build"
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"

  build-and-publish:
    name: Build and publish review image
    needs: [resolve, start-deployment]
    if: needs.resolve.outputs.should_deploy == 'true'
    uses: ./.github/workflows/build-and-publish-to-cms.yml
    permissions:
      contents: read
      id-token: write
    with:
      app_name: app
      ref: ${{ needs.resolve.outputs.commit_hash }}
    secrets: inherit

  update:
    name: Update review environment
    needs: [resolve, start-deployment, build-and-publish]
    if: needs.resolve.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    concurrency: cms-pr-environment-${{ needs.resolve.outputs.pr_number }}
    permissions:
      contents: read
      deployments: write
      id-token: write
      pull-requests: write

    outputs:
      deployed: ${{ steps.current-head.outputs.deploy }}
      skip_reason: ${{ steps.current-head.outputs.skip_reason }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Verify the build is still the pull request head
        id: current-head
        env:
          COMMIT_HASH: ${{ needs.resolve.outputs.commit_hash }}
          DEPLOYMENT_ID: ${{ needs.start-deployment.outputs.deployment_id }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: |
          current_hash="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq .headRefOid)"
          if [[ "${COMMIT_HASH}" != "${current_hash}" ]]; then
            echo "Commit ${COMMIT_HASH} was superseded by ${current_hash}; skipping deployment."
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "skip_reason=Superseded by a newer pull request commit" >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == "pull_request_target" ]] && \
            ! ./bin/cms-pr-environment is-deployed "${PR_NUMBER}" "${DEPLOYMENT_ID}"; then
            echo "The review app was destroyed while this run was building; skipping deployment."
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "skip_reason=Review app was destroyed during the build" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Mark deployment in progress
        if: steps.current-head.outputs.deploy == 'true'
        env:
          DEPLOYMENT_ID: ${{ needs.start-deployment.outputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: |
          ./bin/cms-pr-environment deployment-status \
            "${PR_NUMBER}" "${DEPLOYMENT_ID}" in_progress "Updating the CMS review app"

      - name: Configure CMS Cloud nonprod credentials
        if: steps.current-head.outputs.deploy == 'true'
        uses: ./.github/actions/configure-cms-aws-credentials
        with:
          environment: dev
          nonprod-role-to-assume: ${{ vars.AWS_NONPROD_ROLE_TO_ASSUME }}
          default-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || format('arn:aws:iam::{0}:role/{1}', vars.AWS_ACCOUNT_ID, vars.AWS_ROLE_NAME) }}

      - name: Create or update review app
        if: steps.current-head.outputs.deploy == 'true'
        env:
          COMMIT_HASH: ${{ needs.resolve.outputs.commit_hash }}
          EMMY_IMAGE_REPO: ${{ vars.EMMY_IMAGE_REPO }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: ./bin/cms-pr-environment update "${PR_NUMBER}" "${COMMIT_HASH}" "${EMMY_IMAGE_REPO}"

  finish-deployment:
    name: Finish GitHub deployment
    needs: [resolve, start-deployment, build-and-publish, update]
    if: always() && needs.start-deployment.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Publish final deployment status
        env:
          DEPLOYED: ${{ needs.update.outputs.deployed }}
          DEPLOYMENT_ID: ${{ needs.start-deployment.outputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          SKIP_REASON: ${{ needs.update.outputs.skip_reason }}
          UPDATE_RESULT: ${{ needs.update.result }}
        run: |
          if [[ "${UPDATE_RESULT}" == "success" && "${DEPLOYED}" == "true" ]]; then
            state=success
            description="CMS review app deployed successfully"
          elif [[ "${UPDATE_RESULT}" == "success" && "${DEPLOYED}" == "false" ]]; then
            state=inactive
            description="${SKIP_REASON:-Deployment no longer current}"
          else
            state=failure
            description="CMS review app deployment failed"
          fi

          ./bin/cms-pr-environment deployment-status \
            "${PR_NUMBER}" "${DEPLOYMENT_ID}" "${state}" "${description}"
