name: CMS Cloud PR Environment Destroy
run-name: Destroy CMS Cloud PR Environment ${{ inputs.pr_number }}

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

jobs:
  destroy:
    name: Destroy review environment
    runs-on: ubuntu-latest
    concurrency: cms-pr-environment-${{ inputs.pr_number }}
    permissions:
      contents: read
      deployments: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          # TEMPORARY: Use the manually selected branch while testing the
          # lifecycle script before it is available on the default branch.
          ref: ${{ github.ref }}

      - name: Configure CMS Cloud nonprod credentials
        uses: ./.github/actions/configure-cms-aws-credentials
        with:
          environment: dev
          nonprod-role-to-assume: ${{ vars.AWS_NONPROD_ROLE_TO_ASSUME }}
          default-role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || format('arn:aws:iam::{0}:role/{1}', vars.AWS_ACCOUNT_ID, vars.AWS_ROLE_NAME) }}

      - name: Destroy review app
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: ./bin/cms-pr-environment destroy "${PR_NUMBER}"
