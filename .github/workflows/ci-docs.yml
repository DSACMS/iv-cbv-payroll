name: CI Documentation Checks

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '.github/workflows/ci-docs.yml'
      - '.github/workflows/markdownlint-config.json'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/ci-docs.yml'
      - '.github/workflows/markdownlint-config.json'

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This is the GitHub Actions-friendly port of the linter used in the Makefile.
      - uses: tcort/github-action-markdown-link-check@v1.1.3
        with:
          use-quiet-mode: "yes" # errors only.
          config-file: ".github/workflows/markdownlint-config.json"
