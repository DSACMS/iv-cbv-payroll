name: Set up languages
description: Set up ruby, javascript, and dependencies
runs:
  using: composite
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        working-directory: app
        bundler-cache: true

    - name: Set up node
      uses: actions/setup-node@v4
      with:
        node-version-file: 'app/.node-version'
        cache-dependency-path: 'app/package-lock.json'
        cache: 'npm'

    - name: Install npm dependencies
      shell: bash
      working-directory: app
      run: npm ci

    - name: Install Chromium runtime dependencies
      shell: bash
      working-directory: app
      run: sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$HOME/.cache/puppeteer" npx puppeteer browsers install chrome --install-deps

    - name: Configure Chrome for the CI container
      shell: bash
      run: echo "GROVER_NO_SANDBOX=true" >> "$GITHUB_ENV"

    - name: Install PDF accessibility finalizer
      shell: bash
      working-directory: app
      run: |
        python3 -m venv "$HOME/.local/share/emmy/pdf-venv"
        "$HOME/.local/share/emmy/pdf-venv/bin/python" -m pip install -r lib/pdf/requirements.txt
